spring:
  application:
    name: ai-news-digest
  profiles:
    active: dev

server:
  port: ${APP_PORT:8080}

app:
  groq:
    api-url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
  telegram:
    chat-id: ${TELEGRAM_CHAT_ID:}
  news:
    archive-dir: ./news
    days-lookback: 7

logging:
  level:
    com.ainews: INFO
    org.springframework: WARN
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
